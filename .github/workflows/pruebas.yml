name: Pruebas de aceptación reproducibles
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['monitor.py', 'boards.py', 'sources.json', 'tests/**', 'fetch_fixtures.py', 'requirements.txt', '.github/workflows/pruebas.yml']
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa tesseract-ocr-cat
      - run: python fetch_fixtures.py
      - run: python -m unittest discover -s tests -v
        if: always()
